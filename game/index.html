<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VICE HARBOR — Open-World Crime Game (v7)</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1230;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* The HUD root covers the screen but never eats clicks (the menu and
     the overlay buttons re-enable them). */
  #vh-hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; color: #fff; }

  /* Portrait circle, top-left, with the health bar under it. */
  #vh-face { position: absolute; top: 12px; left: 16px; width: 92px; height: 92px;
    border: 3px solid rgba(255,255,255,.92); border-radius: 50%; overflow: hidden;
    background: linear-gradient(180deg, #8a2f3c, #3d1420 70%);
    box-shadow: 0 0 0 2px rgba(0,0,0,.55), 0 6px 22px rgba(0,0,0,.65);
    display: flex; align-items: center; justify-content: center; }
  #vh-face-letter { font-size: 34px; font-weight: 900; color: #ffd9a0;
    text-shadow: 0 2px 0 rgba(0,0,0,.6), 0 0 18px rgba(255,120,60,.5); }
  #vh-health { position: absolute; top: 112px; left: 16px; width: 92px; }
  #vh-health span { font-size: 10px; font-weight: 800; letter-spacing: 1px; color: #e8eaf0;
    text-shadow: 0 1px 2px rgba(0,0,0,.9); }
  .vh-bar { height: 10px; background: rgba(0,0,0,.65); border: 1px solid rgba(255,255,255,.45);
    border-radius: 5px; overflow: hidden; }
  .vh-fill-health { height: 100%; width: 100%; background: linear-gradient(180deg, #8dffab, #2fbf5a); }
  .vh-fill-health.low { background: linear-gradient(180deg, #ff9a9a, #d21f1f); }
  .vh-fill-armor { height: 100%; width: 100%; background: linear-gradient(180deg, #bfe3ff, #4d8fd1); }
  .vh-fill-stamina { height: 100%; width: 100%; background: linear-gradient(180deg, #fff3b0, #e8b93a); }

  /* Money, stars, clock and vitals, top-right. */
  #vh-money { position: absolute; top: 12px; right: 16px; font-size: 40px; font-weight: 900;
    color: #7dff9e; letter-spacing: 2px; text-align: right; font-variant-numeric: tabular-nums;
    text-shadow: 0 0 2px #000, 0 2px 0 rgba(0,0,0,.9), 0 2px 8px rgba(0,0,0,.9); }
  #vh-stars { position: absolute; top: 62px; right: 16px; font-size: 28px; letter-spacing: 4px;
    color: #ffd23c; text-align: right;
    text-shadow: 0 0 12px rgba(255,210,60,.7), 0 2px 4px rgba(0,0,0,.9); }
  #vh-stars.hot { color: #ff4d4d; text-shadow: 0 0 14px rgba(255,77,77,.9), 0 2px 4px rgba(0,0,0,.9); }
  #vh-clock { position: absolute; top: 100px; right: 16px; font-size: 23px; font-weight: 800;
    color: #fff; text-align: right; font-variant-numeric: tabular-nums;
    text-shadow: 0 2px 0 rgba(0,0,0,.9), 0 2px 6px rgba(0,0,0,.9); }
  #vh-vitals { position: absolute; top: 134px; right: 16px; width: 200px; }
  .vh-vital-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
  .vh-vital-row span { font-size: 10px; font-weight: 800; letter-spacing: 1px; color: #e8eaf0;
    text-shadow: 0 1px 2px rgba(0,0,0,.9); width: 46px; text-align: right; }
  .vh-vital-row .vh-bar { flex: 1; }

  /* The big circular minimap, bottom-left. */
  #vh-map { position: absolute; bottom: 16px; left: 16px; width: 240px; height: 240px;
    border: 3px solid rgba(255,255,255,.92); border-radius: 50%;
    box-shadow: 0 0 0 2px rgba(0,0,0,.55), 0 6px 22px rgba(0,0,0,.65); }

  /* Objective line, bottom-centre; weapon and speed, bottom-right. */
  #vh-objective { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: rgba(10,12,24,.82); border: 1px solid rgba(255,210,60,.55); border-radius: 6px;
    padding: 10px 20px; font-size: 16px; font-weight: 600; white-space: nowrap;
    max-width: 90vw; overflow: hidden; text-overflow: ellipsis; }
  #vh-weapon { position: absolute; bottom: 62px; right: 16px; font-size: 21px; font-weight: 800;
    color: #fff; text-align: right; text-shadow: 0 2px 0 rgba(0,0,0,.9), 0 2px 6px rgba(0,0,0,.9); }
  #vh-weapon.reloading { color: #ffd23c; }
  #vh-speed { position: absolute; bottom: 18px; right: 16px; font-size: 34px; font-weight: 900;
    color: #fff; text-align: right; font-variant-numeric: tabular-nums;
    text-shadow: 0 2px 0 rgba(0,0,0,.9), 0 2px 8px rgba(0,0,0,.9); }

  /* Centre toast for short messages. */
  #vh-toast { position: absolute; top: 22%; left: 50%; transform: translateX(-50%);
    font-size: 25px; font-weight: 700; text-align: center; color: #fff;
    text-shadow: 0 0 14px rgba(255,120,60,.9), 0 2px 6px rgba(0,0,0,.9);
    transition: opacity .4s; max-width: 80vw; }

  /* Mission picker, centred. */
  #vh-menu { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 470px; max-width: 92vw; background: rgba(12,14,28,.94);
    border: 1px solid rgba(255,210,60,.6); border-radius: 10px; padding: 18px 20px;
    pointer-events: auto; box-shadow: 0 10px 40px rgba(0,0,0,.7); }
  #vh-menu h2 { margin: 0 0 12px; color: #ffd23c; letter-spacing: 2px; font-size: 21px; }
  .vh-job-row { display: block; width: 100%; text-align: left; background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.18); color: #fff; border-radius: 6px;
    padding: 10px 12px; margin-bottom: 8px; cursor: pointer; font-size: 14px; }
  .vh-job-row:hover, .vh-job-row.active { background: rgba(255,210,60,.18); border-color: #ffd23c; }
  .vh-job-row b { display: block; font-size: 15px; }
  .vh-job-row span { float: right; color: #7dff9e; font-weight: 700; }
  .vh-job-row em { display: block; font-style: normal; color: #b9bec9; font-size: 12px; margin-top: 3px; }

  /* Full-screen screens: start, pause, busted, done. A light wash,
     transparent in the middle, so the city stays visible around the panel. */
  .vh-screen { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; pointer-events: auto;
    background: linear-gradient(180deg, rgba(20,12,40,.55), rgba(20,12,40,.16) 32%,
      rgba(20,12,40,.16) 68%, rgba(20,12,40,.55)); }
  .vh-screen h1 { margin: 0; font-size: 62px; font-weight: 900; letter-spacing: 6px;
    background: linear-gradient(180deg, #ffd23c, #ff4fd8 70%, #ff6b3c);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 40px rgba(255,79,216,.35); }
  .vh-screen .vh-tag { font-size: 17px; color: #dfe3ee; margin: 14px 0 22px; line-height: 1.5;
    max-width: 620px; padding: 0 16px; }
  .vh-keys { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 26px;
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.18);
    border-radius: 8px; padding: 14px 20px; margin-bottom: 24px; text-align: left;
    font-size: 14px; color: #cfd4e0; }
  .vh-key-row b { color: #ffd23c; margin-right: 8px; }
  .vh-screen button { pointer-events: auto; cursor: pointer; font-size: 19px; font-weight: 800;
    letter-spacing: 2px; color: #1a1230; background: linear-gradient(180deg, #ffd23c, #ff9d2e);
    border: none; border-radius: 8px; padding: 14px 42px;
    box-shadow: 0 6px 24px rgba(255,157,46,.5); }
  .vh-screen button:hover { filter: brightness(1.1); }
  .vh-hint { margin-top: 16px; font-size: 12px; color: #9aa0b0; }

  /* Photo mode hides every HUD element except the hint. */
  #vh-hud.photo #vh-face, #vh-hud.photo #vh-health, #vh-hud.photo #vh-money,
  #vh-hud.photo #vh-stars, #vh-hud.photo #vh-clock, #vh-hud.photo #vh-vitals,
  #vh-hud.photo #vh-map, #vh-hud.photo #vh-objective, #vh-hud.photo #vh-weapon,
  #vh-hud.photo #vh-speed, #vh-hud.photo #vh-toast, #vh-hud.photo #vh-menu {
    display: none !important; }
  #vh-photo-hint { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    font-size: 12px; font-weight: 700; letter-spacing: 1px; color: #e8eaf0;
    background: rgba(10,10,24,.55); border: 1px solid rgba(255,255,255,.25);
    border-radius: 6px; padding: 6px 12px; display: none; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="game" aria-label="VICE HARBOR: explore the city on foot or by car, run missions and outrun the police"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
