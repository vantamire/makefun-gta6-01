<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VICE HARBOR — Open-World Crime Game (v8)</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1230;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(180deg, #1a0a28, #3c1020); color: #ffd23c; z-index: 5;
    font-size: 22px; font-weight: 800; letter-spacing: 3px; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="game"></canvas>
<div id="loading">VICE HARBOR — loading the city…</div>
<div id="status" role="status" aria-live="polite">VICE HARBOR v8, an open-world crime game. Press Start to play.</div>
<script type="module">
  import './src/boot.js';
  document.getElementById('loading').remove();
</script>
</body>
</html>
